openapi: 3.1.0
info:
  title: Общие компоненты структуры сообщений
  version: 1.0.0
paths: {}
components:
  schemas:
    Message:
      description: Заголовки и тело сообщения Kafka
      type: object
      properties:
        headers:
          $ref: '#/components/schemas/MessageHeaders'
        payload:
          $ref: '#/components/schemas/MessagePayload'
      required:
        - headers
        - payload
    MessageHeaders:
      description: Обязательные заголовки сообщения Kafka
      type: object
      properties:
        key:
          type: string
          description: Ключ идемпотентности сообщения
        createdAt:
          type: string
          format: date-time
          description: Дата, когда сообщение было помещено в очередь
        schemaName:
          type: string
          description: Тип сообщения
        schemaVersion:
          type: string
          pattern: '^\d+\.\d+(\.\d+(-[a-z0-9]+)?)?$'
          description: Версия структуры сообщения
        uuid:
          type: string
          format: uuid
          description: UUID сообщения
      additionalProperties: true
      required:
        - key
        - createdAt
        - schemaVersion
        - uuid
    MessagePayload:
      description: Тело сообщения Kafka
      type: object
      additionalProperties: true
